[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wallstreet-learning"
version = "0.1.0"
description = "Learn Python by building a market-research and paper-trading application"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jerome Thayananthajothy" }]
keywords = ["python", "market-research", "paper-trading", "backtesting", "education"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Thavarshan/wallstreet"
Repository = "https://github.com/Thavarshan/wallstreet"
Issues = "https://github.com/Thavarshan/wallstreet/issues"
Documentation = "https://github.com/Thavarshan/wallstreet/tree/main/docs"
Changelog = "https://github.com/Thavarshan/wallstreet/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
